name: t3code-build

# Every push and pull request that touches T3 Code builds and smoke-tests the
# image at the T3 Code version pinned in t3code/Dockerfile. A push to main
# publishes it to Docker Hub when that has no image for that version yet, which is
# what merging a t3code-bump pull request does. A manual run with `publish`
# ticked publishes it regardless. Community Apps reads an image's Last Update
# date from Docker Hub.
on:
  push:
    paths: &paths
      - t3code/**
      - templates/t3code.xml
      - ca_profile.xml
      - .github/workflows/t3code-build.yml
  pull_request:
    paths: *paths
  workflow_dispatch:
    inputs:
      publish:
        description: Push the tested image to Docker Hub (adds :latest on main)
        type: boolean
        default: false

permissions:
  actions: write
  contents: write
  pull-requests: write

env:
  IMAGE: docker.io/originalbyteme/unraid-t3code

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Lint
        run: |
          shellcheck t3code/entrypoint.sh t3code/vault-sync
          python3 -c 'import sys, xml.etree.ElementTree as E; [E.parse(f) for f in sys.argv[1:]]' templates/*.xml ca_profile.xml

      - name: Build
        run: |
          echo "VERSION=$(sed -n 's/^ARG T3CODE_VERSION=//p' t3code/Dockerfile)" >> "$GITHUB_ENV"
          docker build -t unraid-t3code:test t3code

      - name: PUID and PGID move the t3code account
        run: |
          ids=$(docker run --rm -e PUID=1234 -e PGID=4321 unraid-t3code:test sh -c 'echo "$(id -u):$(id -g)"')
          echo "$ids"
          test "$ids" = 1234:4321

      - name: Agents can use a mapped Docker socket
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock unraid-t3code:test docker ps

      - name: Agent names install their npm packages, and omp runs on Bun
        run: docker run --rm -e AGENTS='OMP, claude' unraid-t3code:test sh -c 'omp --version && claude --version'

      # A local rclone WebDAV server stands in for Nextcloud.
      - name: vault-sync keeps ~/vault and the WebDAV folder in step both ways
        run: |
          docker run --rm -e VAULT_WEBDAV_URL=http://127.0.0.1:8080 -e VAULT_SYNC_INTERVAL=2 unraid-t3code:test bash -c '
            set -e
            wait_for() { for _ in $(seq 30); do eval "$1" && return; sleep 1; done; echo "timed out: $1"; exit 1; }
            mkdir -p /tmp/dav/.obsidian && echo note > /tmp/dav/a.md && echo {} > /tmp/dav/.obsidian/workspace.json
            rclone serve webdav /tmp/dav --addr 127.0.0.1:8080 --dir-cache-time 0s -q &
            vault-sync & sync=$!
            wait_for "[ -f ~/vault/a.md ]"
            test ! -e ~/vault/.obsidian/workspace.json
            echo agent > ~/vault/b.md
            wait_for "[ -f /tmp/dav/b.md ]"
            echo "edited elsewhere" > /tmp/dav/a.md
            wait_for "grep -q elsewhere ~/vault/a.md"
            rm ~/vault/b.md
            wait_for "[ ! -e /tmp/dav/b.md ]"
            # After a critical error rclone renames its listings and the next round
            # resyncs, which overwrites one side of a two-sided edit unless kept.
            kill $sync && wait $sync || true
            while pgrep -f "^rclone bisync" >/dev/null; do sleep 0.2; done
            for f in ~/.cache/vault-sync/*.lst; do mv "$f" "$f-err"; done
            echo "edited in the vault" > ~/vault/a.md && echo "edited on the server" > /tmp/dav/a.md
            vault-sync &
            wait_for "ls ~/.cache/vault-sync/*.path1.lst"
            kept=$(cat ~/vault/a.md /tmp/dav/a.md ~/vault/.vault-sync-backup/*/a.md /tmp/dav/.vault-sync-backup/*/a.md 2>/dev/null || true)
            grep -q "in the vault" <<<"$kept" && grep -q "on the server" <<<"$kept"'

      # The Chrome build this T3 Code release downloads, run the way T3 runs it
      # in the container (no sandbox), against the image's libraries and fonts.
      - name: T3's browser starts and renders text
        run: |
          chrome=$(curl -fsSL "https://raw.githubusercontent.com/pingdotgg/t3code/v$VERSION/apps/server/src/preview/PreviewBrowser.ts" \
            | sed -n 's/^const VERSION = "\(.*\)";$/\1/p')
          test -n "$chrome"
          docker run --rm -e CHROME="$chrome" unraid-t3code:test sh -c '
            cd /tmp &&
            curl -fsSL -o chrome.zip "https://storage.googleapis.com/chrome-for-testing-public/$CHROME/linux64/chrome-headless-shell-linux64.zip" &&
            unzip -q chrome.zip &&
            fc-match sans-serif &&
            chrome-headless-shell-linux64/chrome-headless-shell --no-sandbox --dump-dom "data:text/html,<p>rendered</p>"' > chrome.out
          cat chrome.out
          grep -q '<p>rendered</p>' chrome.out

      - name: Server starts under SERVER_NAME, pairs a client and lists GIT_REPOS as a project across restarts
        run: |
          docker run -d --name t3 -p 3773:3773 -e SERVER_NAME='Test server' \
            -e GIT_REPOS=octocat/Hello-World -e SHELL=zsh -e OH_MY_ZSH=true unraid-t3code:test
          ready() {
            for _ in $(seq 90); do
              docker logs t3 > t3.log 2>&1
              [ "$(grep -c 'T3 Code server is ready' t3.log)" -ge "$1" ] && return
              sleep 2
            done
            return 1
          }
          ready 1 || true
          docker restart t3
          ready 2 || true
          # The log carries live pairing tokens; keep them out of this public log.
          grep -v -e 'Token:' -e 'token=' -e 'token%3D' t3.log || true
          test "$(grep -c 'T3 Code server is ready' t3.log)" = 2
          test "$(grep -c 'added /projects/Hello-World to T3 Code' t3.log)" = 1
          test "$(grep -c '\[unraid-t3code\] WARNING' t3.log)" = 0
          curl -fsS http://127.0.0.1:3773/ | grep -q '<title>T3 Code'
          curl -fsS http://127.0.0.1:3773/.well-known/t3/environment | jq -e '.label == "Test server"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3773/api/projects)" = 401
          token=$(docker exec -u t3code t3 t3 auth pairing create --json | jq -r .credential)
          curl -fsS -c jar -H 'content-type: application/json' -d "{\"credential\":\"$token\"}" \
            http://127.0.0.1:3773/api/auth/browser-session | jq -e .authenticated
          curl -fsS -b jar http://127.0.0.1:3773/api/projects | jq -e '[.. | .workspaceRoot? // empty] | index("/projects/Hello-World")'
          test "$(docker exec t3 stat -c %u /projects/Hello-World)" = 99
          test "$(docker exec t3 getent passwd t3code | cut -d: -f7)" = /usr/bin/zsh
          docker exec t3 test -f /home/t3code/.oh-my-zsh/oh-my-zsh.sh

      - name: Merge automated bump PR
        if: github.event_name == 'workflow_dispatch' && startsWith(github.ref_name, 't3-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Smoke tests passed. Merging ${{ github.ref_name }} into main..."
          # --repo merges and deletes the branch on GitHub only; without it gh also
          # switches the checkout to main, which the shallow checkout does not have.
          gh pr merge "${{ github.ref_name }}" --repo "$GITHUB_REPOSITORY" --merge --delete-branch
          echo "Triggering publish on main..."
          gh workflow run t3code-build.yml --ref main -f publish=true

      - name: Publish
        if: inputs.publish || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login docker.io -u originalbyteme --password-stdin
          if [ "$GITHUB_EVENT_NAME" = push ] && docker manifest inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "$IMAGE:$VERSION is already published"
            exit 0
          fi
          tags="$IMAGE:$VERSION"
          if [ "$GITHUB_REF" = refs/heads/main ]; then tags="$tags $IMAGE:latest"; fi
          for tag in $tags; do
            docker tag unraid-t3code:test "$tag"
            docker push "$tag"
          done

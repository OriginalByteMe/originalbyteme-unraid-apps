name: orca-build

# Every push and pull request that touches Orca builds and smoke-tests the image
# at the Orca version pinned in orca/Dockerfile. A push to main publishes it to each
# registry that has no image for that version yet, which is what merging an
# orca-bump pull request does. A manual run with `publish` ticked publishes it
# regardless. Docker Hub gets a copy because Community Apps reads an image's
# Last Update date from Docker Hub, even for images on GHCR.
on:
  push:
    paths: &paths
      - orca/**
      - templates/orca.xml
      - ca_profile.xml
      - .github/workflows/orca-build.yml
  pull_request:
    paths: *paths
  workflow_dispatch:
    inputs:
      publish:
        description: Push the tested image to GHCR and Docker Hub (adds :latest on main)
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/originalbyteme/unraid-orca
  HUB_IMAGE: docker.io/originalbyteme/unraid-orca

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Lint
        run: |
          shellcheck orca/entrypoint.sh
          python3 -c 'import sys, xml.etree.ElementTree as E; [E.parse(f) for f in sys.argv[1:]]' templates/*.xml ca_profile.xml

      - name: Build
        run: |
          echo "VERSION=$(sed -n 's/^ARG ORCA_VERSION=//p' orca/Dockerfile)" >> "$GITHUB_ENV"
          docker build -t unraid-orca:test orca

      - name: Refuses to start without a pairing address
        run: |
          if docker run --rm unraid-orca:test > out.log 2>&1; then cat out.log; exit 1; fi
          cat out.log
          grep -q 'set ORCA_PAIRING_ADDRESS' out.log

      - name: PUID and PGID move the orca account
        run: |
          ids=$(docker run --rm -e PUID=1234 -e PGID=4321 unraid-orca:test sh -c 'echo "$(id -u):$(id -g)"')
          echo "$ids"
          test "$ids" = 1234:4321

      - name: Agents can use a mapped Docker socket
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock unraid-orca:test docker ps

      - name: Agent names install their npm packages, and omp runs on Bun
        run: docker run --rm -e AGENTS='OMP, claude' unraid-orca:test sh -c 'omp --version && claude --version'

      - name: Server starts, serves the web client, adds GIT_REPOS and opens zsh terminals
        run: |
          docker run -d --name orca -p 6768:6768 -e ORCA_PAIRING_ADDRESS=127.0.0.1 \
            -e GIT_REPOS=octocat/Hello-World -e SHELL=zsh -e OH_MY_ZSH=true unraid-orca:test
          for _ in $(seq 90); do
            docker logs orca > orca.log 2>&1
            grep -q 'added /projects/Hello-World to Orca' orca.log && break
            sleep 2
          done
          # The log carries live pairing links; keep them out of this public log.
          grep -v -e 'pairing=' -e 'code=' orca.log || true
          grep -q 'Orca server ready' orca.log
          grep -q 'added /projects/Hello-World to Orca' orca.log
          curl -fsS http://127.0.0.1:6768/web-index.html | grep -qi '<title>Orca Web</title>'
          test "$(docker exec orca stat -c %u /projects/Hello-World)" = 99
          test "$(docker exec orca getent passwd orca | cut -d: -f7)" = /usr/bin/zsh
          term=$(docker exec -u orca orca orca-ide terminal create --worktree path:/projects/Hello-World \
            --command 'echo "shell=$0 omz=$ZSH"' --json | jq -r '[.. | .handle? | strings][0]')
          for _ in $(seq 30); do
            docker exec -u orca orca orca-ide terminal read --terminal "$term" --json > term.json
            grep -q 'omz=/home/orca/.oh-my-zsh' term.json && break
            sleep 1
          done
          grep -o 'shell=[^ ]*zsh omz=/home/orca/.oh-my-zsh' term.json || { cat term.json; exit 1; }

      - name: Publish
        if: inputs.publish || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "$DOCKERHUB_TOKEN" | docker login docker.io -u originalbyteme --password-stdin
          for image in "$IMAGE" "$HUB_IMAGE"; do
            if [ "$GITHUB_EVENT_NAME" = push ] && docker manifest inspect "$image:$VERSION" >/dev/null 2>&1; then
              echo "$image:$VERSION is already published"
              continue
            fi
            tags="$image:$VERSION"
            if [ "$GITHUB_REF" = refs/heads/main ]; then tags="$tags $image:latest"; fi
            for tag in $tags; do
              docker tag unraid-orca:test "$tag"
              docker push "$tag"
            done
          done

name: herdr-build

# Every push and pull request that touches Herdr builds and smoke-tests the
# image at the Herdr version pinned in herdr/Dockerfile. A push to main
# publishes it to Docker Hub when that has no image for that version yet, which
# is what merging a herdr-bump pull request does. A manual run with `publish`
# ticked publishes it regardless.
on:
  push:
    paths: &paths
      - common/**
      - herdr/**
      - templates/herdr.xml
      - ca_profile.xml
      - .github/workflows/herdr-build.yml
  pull_request:
    paths: *paths
  workflow_dispatch:
    inputs:
      publish:
        description: Push the tested image to Docker Hub (adds :latest on main)
        type: boolean
        default: false

permissions:
  actions: write
  contents: write
  pull-requests: write

env:
  IMAGE: docker.io/originalbyteme/unraid-herdr

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Lint
        run: |
          shellcheck herdr/entrypoint.sh common/onboard
          python3 -c 'import sys, xml.etree.ElementTree as E; [E.parse(f) for f in sys.argv[1:]]' templates/*.xml ca_profile.xml

      - name: Build
        run: |
          echo "VERSION=$(sed -n 's/^ARG HERDR_VERSION=//p' herdr/Dockerfile)" >> "$GITHUB_ENV"
          docker build --build-context common=common -t unraid-herdr:test herdr

      - name: PUID and PGID move the herdr account
        run: |
          ids=$(docker run --rm -e PUID=1234 -e PGID=4321 unraid-herdr:test sh -c 'echo "$(id -u):$(id -g)"')
          echo "$ids"
          test "$ids" = 1234:4321

      - name: Agents can use a mapped Docker socket
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock unraid-herdr:test docker ps

      - name: Agent names install their npm packages, and omp runs on Bun
        run: docker run --rm -e AGENTS='OMP, claude' unraid-herdr:test sh -c 'omp --version && claude --version'

      - name: SSH with an authorized key reaches the running Herdr server, with keys and clones kept across restarts
        run: |
          ssh-keygen -q -t ed25519 -N '' -f key
          docker run -d --name herdr -p 2222:2222 -e AUTHORIZED_KEYS="$(cat key.pub)" \
            -e GIT_REPOS=octocat/Hello-World -e SHELL=zsh -v "$PWD/data:/home/herdr" unraid-herdr:test
          ssh_herdr() {
            ssh -i key -p 2222 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=known_hosts \
              -o BatchMode=yes herdr@127.0.0.1 "$@"
          }
          up() { for _ in $(seq 30); do ssh_herdr herdr status server 2>/dev/null | grep -qx 'status: running' && return; sleep 2; done; return 1; }
          up || { docker logs herdr; ssh_herdr herdr status server || true; exit 1; }
          ssh_herdr 'command -v herdr gh node && test -d /projects/Hello-World/.git && echo "$SHELL"' | tee out
          grep -qx /usr/bin/zsh out
          docker restart herdr
          up
          test "$(grep -c 'herdr server started' <(docker logs herdr 2>&1))" = 2
          test "$(docker logs herdr 2>&1 | grep -c '\[unraid-herdr\] WARNING')" = 0
          test "$(docker exec herdr stat -c %u /projects/Hello-World)" = 99
          if ssh -p 2222 -o BatchMode=yes -o UserKnownHostsFile=known_hosts herdr@127.0.0.1 true 2>/dev/null; then
            echo "login without the key succeeded"; exit 1
          fi

      - name: The Console walks through the sign-ins on its first open only, then opens the shell
        run: |
          console() {
            { printf 'n\n%.0s' $(seq 6); echo 'echo "shell as $(id -un)"; exit'; } |
              script -qec 'docker exec -it herdr bash' /dev/null
          }
          console | tee first.out
          console | tee second.out
          grep -q '\[ \] GitHub' first.out
          grep -q '\[x\] SSH keys' first.out
          test "$(grep -c GitHub second.out)" = 0
          grep -q 'shell as herdr' second.out

      - name: Merge automated bump PR
        if: github.event_name == 'workflow_dispatch' && startsWith(github.ref_name, 'herdr-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --branch "${{ github.ref_name }}" --event pull_request \
            --status action_required --json databaseId -q '.[].databaseId' |
            while read -r run; do gh run delete "$run" --repo "$GITHUB_REPOSITORY" < /dev/null || true; done
          gh pr merge "${{ github.ref_name }}" --repo "$GITHUB_REPOSITORY" --merge --delete-branch
          gh workflow run herdr-build.yml --ref main -f publish=true

      - name: Publish
        if: >-
          github.repository_owner == 'OriginalByteMe'
          && (inputs.publish || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login docker.io -u originalbyteme --password-stdin
          if [ "$GITHUB_EVENT_NAME" = push ] && docker manifest inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "$IMAGE:$VERSION is already published"
            exit 0
          fi
          tags="$IMAGE:$VERSION"
          if [ "$GITHUB_REF" = refs/heads/main ]; then tags="$tags $IMAGE:latest"; fi
          for tag in $tags; do
            docker tag unraid-herdr:test "$tag"
            docker push "$tag"
          done

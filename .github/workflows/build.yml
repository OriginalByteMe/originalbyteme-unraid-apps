name: build

# Every push and pull request builds and smoke-tests the image without
# publishing it. Publishing happens only from a manual run with `publish`
# ticked, or from the schedule, which GitHub runs on the default branch only
# and which pushes just the Orca releases that have no image yet.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Push the tested image to GHCR (adds :latest on main)
        type: boolean
        default: false
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/originalbyteme/unraid-orca

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.orca.outputs.version }}
      build: ${{ steps.orca.outputs.build }}
    steps:
      - id: orca
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(gh release view --repo stablyai/orca --json tagName -q .tagName)
          version=${version#v}
          build=true
          if [ "$GITHUB_EVENT_NAME" = schedule ] && docker manifest inspect "$IMAGE:$version" >/dev/null 2>&1; then
            build=false
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Orca $version, build=$build"

  image:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Lint
        run: |
          shellcheck entrypoint.sh
          python3 -c 'import sys, xml.etree.ElementTree as E; [E.parse(f) for f in sys.argv[1:]]' templates/*.xml ca_profile.xml

      - name: Build
        run: docker build --build-arg ORCA_VERSION="$VERSION" -t unraid-orca:test .

      - name: Refuses to start without a pairing address
        run: |
          if docker run --rm unraid-orca:test > out.log 2>&1; then cat out.log; exit 1; fi
          cat out.log
          grep -q 'set ORCA_PAIRING_ADDRESS' out.log

      - name: PUID and PGID move the orca account
        run: |
          ids=$(docker run --rm -e PUID=1234 -e PGID=4321 unraid-orca:test sh -c 'echo "$(id -u):$(id -g)"')
          echo "$ids"
          test "$ids" = 1234:4321

      - name: Agents can use a mapped Docker socket
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock unraid-orca:test docker ps

      - name: Server starts, serves the web client and adds GIT_REPOS
        run: |
          docker run -d --name orca -p 6768:6768 \
            -e ORCA_PAIRING_ADDRESS=127.0.0.1 -e GIT_REPOS=octocat/Hello-World unraid-orca:test
          for _ in $(seq 90); do
            docker logs orca > orca.log 2>&1
            grep -q 'added /home/orca/projects/Hello-World to Orca' orca.log && break
            sleep 2
          done
          cat orca.log
          grep -q 'Orca server ready' orca.log
          grep -q 'added /home/orca/projects/Hello-World to Orca' orca.log
          curl -fsS http://127.0.0.1:6768/web-index.html | grep -qi '<title>Orca Web</title>'
          test "$(docker exec orca stat -c %u /home/orca/projects/Hello-World)" = 99

      - name: Publish
        if: github.event_name == 'schedule' || inputs.publish
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          tags="$IMAGE:$VERSION"
          if [ "$GITHUB_REF" = refs/heads/main ]; then tags="$tags $IMAGE:latest"; fi
          for tag in $tags; do
            docker tag unraid-orca:test "$tag"
            docker push "$tag"
          done
